<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="light">
	<meta name="theme-color" content="#1a1a1a">
    <title>Skyzer – Liens & Réseaux</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container" id="cardContainer">

        <div class="swipe-guide" aria-label="Cliquer sur une icône pour changer de page">
            <div class="swipe-guide-row">
                <button class="swipe-guide-button" data-guide="0" type="button" aria-label="Afficher mes réseaux">
                    <img class="swipe-guide-icon active" src="images/fiche-identite.svg" alt="" aria-hidden="true">
                </button>
                <img class="swipe-guide-hand target-right" id="swipeGuideHand" src="images/doigt-swipe.svg" alt="" aria-hidden="true">
                <button class="swipe-guide-button" data-guide="1" type="button" aria-label="Afficher le compteur de boops">
                    <img class="swipe-guide-icon" src="images/truffe.svg" alt="" aria-hidden="true">
                </button>
            </div>
            <p class="swipe-guide-text target-right" id="swipeGuideText">Clique ici pour laisser une trace de ton passage</p>
        </div>

        <div class="card-circle" id="cardCircle">
            <img id="circleImg"
                 src="https://raw.githubusercontent.com/Skyzer-Woolf/Skyzer-Woolf.github.io/f9880bcde8451c459757730ca01dd7712e327cb0/Image_Presentation.png"
                 class="avatar" alt="Avatar de Skyzer" draggable="false">
        </div>

        <p class="boop-photo-instruction" id="boopPhotoInstruction">Touche la photo pour me boop et laisser une trace de ton passage</p>

        <div class="card-content">
            <!-- Vue 1 : Présentation -->
            <div class="view active" data-view="0">
                <h1>Skyzer</h1>
                <p>Fursuiter • Conventions • France</p>

                <div class="links">
                    <a href="instagram://user?username=skyzer60"
                       onclick="setTimeout(function(){ window.location='https://instagram.com/skyzer60'; }, 1000);">
                        Instagram
                    </a>
                    <a href="https://www.facebook.com/skyzer.woolf.9/">Facebook</a>
                    <a href="https://t.me/skyzer60">Telegram</a>
                </div>
            </div>

            <!-- Vue 2 : Boop -->
            <div class="view" data-view="1">
                <div id="pseudoForm" class="pseudo-form">
                    <input type="text" id="pseudoInput" placeholder="Ton pseudo" maxlength="20">
                    <button id="pseudoSubmit">Valider</button>
                </div>

                <div class="boop-table-panel">
                    <table class="boop-table">
                        <caption>Derniers boops</caption>
                        <thead>
                            <tr><th scope="col">Pseudo</th></tr>
                        </thead>
                        <tbody id="lastBoopsBody"></tbody>
                    </table>
                </div>

                <div class="boop-table-panel">
                    <table class="boop-table top-boopers-table">
                        <caption>Top boopeurs</caption>
                        <thead>
                            <tr><th scope="col">Pseudo</th><th scope="col">Boops</th></tr>
                        </thead>
                        <tbody id="topBoopersBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
